    opacity: var(--image-opacity);
  }
  .fx {
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 22%, var(--star), transparent),
      radial-gradient(1px 1px at 18% 78%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 42% 12%, var(--star), transparent),
      radial-gradient(1px 1px at 63% 86%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 81% 30%, var(--star), transparent),
      radial-gradient(1px 1px at 93% 68%, var(--star), transparent),
      radial-gradient(55% 65% at 50% 50%, rgba(110, 170, 255, 0.10), transparent 70%);
  }

  .clock {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.15em;
    min-width: 0;
  }
  .time {
    all: unset;
    display: inline-block;
    position: relative;
    cursor: pointer;
    font-size: clamp(2.25rem, min(17vw, 36vh), 8.5rem);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 0.35em var(--glow), 0 0 1.1em var(--glow);
    white-space: nowrap;
  }
  .time:focus-visible { outline: 2px solid var(--glow); outline-offset: 6px; border-radius: 4px; }
  /* AM/PM floats beside the digits so the digits themselves sit dead center */
  .time small {
    position: absolute;
    left: 100%;
    bottom: 0.2em;
    margin-left: 0.4em;
    font-size: 0.26em;
    font-weight: 300;
    color: var(--dim);
    text-shadow: none;
  }
  .colon { animation: soft 2s ease-in-out infinite; }
  @keyframes soft { 50% { opacity: 0.35; } }
  .date { font-size: clamp(1rem, min(4.2vw, 9vh), 2rem); font-weight: 300; }
  .weather { font-size: clamp(0.9rem, min(3.4vw, 7.5vh), 1.45rem); font-weight: 300; opacity: 0.9; }
  .weather[hidden] { display: none; }
  .greeting { font-size: clamp(0.85rem, min(3vw, 6.5vh), 1.2rem); font-weight: 300; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .colon { animation: none; } }
</style>
</head>
<body>
  <div class="photo" aria-hidden="true"></div>
  <div class="fx" aria-hidden="true"></div>
  <main class="clock">
    <button class="time" id="time" type="button" aria-label="Switch between 12 and 24 hour time"></button>
    <div class="date" id="date"></div>
    <div class="weather" id="weather" hidden></div>
    <div class="greeting" id="greeting"></div>
  </main>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get("theme") === "light") document.documentElement.setAttribute("data-theme", "light");

  var h24 = false;
  try { h24 = localStorage.getItem("h24") === "1"; } catch (e) {}

  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var greetEl = document.getElementById("greeting");

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    var d = new Date();
    var h = d.getHours();
    var shown = h24 ? pad(h) : String(h % 12 || 12);
    var suffix = h24 ? "" : "<small>" + (h >= 12 ? "PM" : "AM") + "</small>";
    timeEl.innerHTML = shown + '<span class="colon">:</span>' + pad(d.getMinutes()) + suffix;
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    greetEl.textContent = h < 5 ? "Still up?" : h < 12 ? "Good morning." : h < 18 ? "Good afternoon." : "Good evening.";
  }

  timeEl.addEventListener("click", function () {
    h24 = !h24;
    try { localStorage.setItem("h24", h24 ? "1" : "0"); } catch (e) {}
    tick();
  });

  /* Weather: free Open-Meteo service, no account or key needed.
     Change the place by editing name/lat/lon; use "celsius" for Celsius. */
  var WEATHER = { name: "Flagstaff", lat: 35.1983, lon: -111.6513, unit: "fahrenheit" };
  var weatherEl = document.getElementById("weather");

  function describe(code) {
    if (code === 0) return "Clear";
    if (code === 1) return "Mostly clear";
    if (code === 2) return "Partly cloudy";
    if (code === 3) return "Overcast";
    if (code === 45 || code === 48) return "Fog";
    if (code >= 51 && code <= 57) return "Drizzle";
    if (code >= 61 && code <= 67) return "Rain";
    if (code >= 71 && code <= 77) return "Snow";
    if (code >= 80 && code <= 82) return "Showers";
    if (code === 85 || code === 86) return "Snow showers";
    if (code >= 95) return "Thunderstorm";
    return "";
  }

  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER.lat +
      "&longitude=" + WEATHER.lon +
      "&current=temperature_2m,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min" +
      "&temperature_unit=" + WEATHER.unit +
      "&timezone=auto&forecast_days=1";
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (w) {
        var now = Math.round(w.current.temperature_2m);
        var hi = Math.round(w.daily.temperature_2m_max[0]);
        var lo = Math.round(w.daily.temperature_2m_min[0]);
        var cond = describe(w.current.weather_code);
        weatherEl.textContent = now + "\u00B0 " + (cond ? cond + " \u00B7 " : "") + "H " + hi + "\u00B0 L " + lo + "\u00B0";
        weatherEl.hidden = false;
      })
      .catch(function () { weatherEl.hidden = true; });
  }

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
